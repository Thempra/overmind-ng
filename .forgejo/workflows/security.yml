name: security
# Escáneres de seguridad → SonarQube + DefectDojo.
# Job único: el runner es compartido y los binarios de escáner son estáticos.
# Sin actions/checkout ni artifacts (necesitan Node) — checkout con git + FORGEJO_TOKEN.
#
# Sin secretos de Forgejo: el job pide un ID token OIDC a Forgejo, lo canjea en
# OpenBao y lee `secret/data/ci/shared/*` (Sonar + DefectDojo). El token vive lo
# que dura el job (rol `ci-scan-apps|research|hardware`, 30 min).
on:
  push:
    branches: [main, master, develop, dev]
    paths-ignore: ["docs/**", "*.md"]
  schedule:
    - cron: "0 4 * * 1"  # lunes 04:00 re-escáner completo
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.repository }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: cimg/base:current
    # Requerido para que Forgejo inyecte ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN.
    # Tiene que ir a nivel de job: Forgejo lo lee del payload del job.
    enable-openid-connect: true
    env:
      PROJECT_KEY: ${{ vars.PRODUCT_NAME || github.repository }}
      REPO_PATH: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      GH_TOK: ${{ github.token }}
      BAO_ADDR: https://vault.thempra.net
      # Un rol JWT por organización: replica el alcance que tenían los secretos
      # de org de Forgejo, sin ampliarlo.
      BAO_ROLE: ci-scan-apps
    steps:
      - name: Checkout
        run: |
          echo "192.168.50.5 code.thempra.net dojo.thempra.net sast.thempra.net" | sudo tee -a /etc/hosts >/dev/null
          REPO_URL="https://x-access-token:${GH_TOK}@code.thempra.net/${REPO_PATH}.git"
          # Clavar el SHA disparado: evita inconsistencias entre ramas cuando el
          # workflow se rollout en una rama y el push va por otra.
          git init -q repo && cd repo && git remote add origin "$REPO_URL"
          git fetch -q --depth 5 origin "$COMMIT_SHA" || git fetch -q --depth 5 origin "$REF_NAME"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          ls | head -5
      - name: Secretos (OIDC → OpenBao)
        # Canjea el ID token del job por un token de OpenBao y lo publica en
        # GITHUB_ENV para los pasos siguientes. `::add-mask::` evita que el
        # token aparezca en los logs si algún comando lo escupe en un error.
        run: |
          set -e
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?sin OIDC — falta enable-openid-connect en el job}"
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=openbao" > /tmp/idtoken.json
          JWT=$(jq -r .value /tmp/idtoken.json)
          curl -fsS -X POST "$BAO_ADDR/v1/auth/jwt/login" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg r "$BAO_ROLE" --arg j "$JWT" '{role:$r,jwt:$j}')" > /tmp/login.json
          TOK=$(jq -r '.auth.client_token // empty' /tmp/login.json)
          [ -n "$TOK" ] || { echo "::error::login en OpenBao falló: $(jq -c .errors /tmp/login.json)"; exit 1; }
          echo "::add-mask::$TOK"
          rm -f /tmp/idtoken.json /tmp/login.json
          fetch() {  # fetch <sonar|dojo> <VAR_PREFIX>
            curl -fsS -H "X-Vault-Token: $TOK" "$BAO_ADDR/v1/secret/data/ci/shared/$1" > /tmp/sec.json
            U=$(jq -r '.data.data.url' /tmp/sec.json)
            T=$(jq -r '.data.data.token' /tmp/sec.json)
            [ -n "$U" ] && [ "$U" != null ] || { echo "::error::ci/shared/$1 sin 'url'"; exit 1; }
            [ -n "$T" ] && [ "$T" != null ] || { echo "::error::ci/shared/$1 sin 'token'"; exit 1; }
            echo "::add-mask::$T"
            echo "${2}_URL=$U" >> "$GITHUB_ENV"
            echo "${2}_TOKEN=$T" >> "$GITHUB_ENV"
          }
          fetch sonar SONAR
          fetch dojo DOJO
          # dojo_upload.py lee DOJO_API_TOKEN; el KV lo llama 'token'.
          echo "DOJO_API_TOKEN=$(grep '^DOJO_TOKEN=' "$GITHUB_ENV" | cut -d= -f2-)" >> "$GITHUB_ENV"
          rm -f /tmp/sec.json
          echo "secretos cargados (sonar+dojo)"
      - name: Tests + coverage (pre-Sonar)
        # Repos con marcador .security/pytest-cov: ejecutamos pytest --cov para
        # que el coverage.xml exista ANTES del análisis (sin eso Sonar mide 0%).
        run: |
          set -e
          MK="repo/.security/pytest-cov"
          [ -f "$MK" ] || { echo "sin marcador pytest-cov — se omite"; exit 0; }
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq python3-pip >/dev/null
          sudo python3 -m pip install --break-system-packages --no-cache-dir --quiet pytest pytest-cov 2>/dev/null || \
            python3 -m pip install --break-system-packages --no-cache-dir --quiet pytest pytest-cov
          if [ -f repo/.security/requirements-ci.txt ]; then REQ=repo/.security/requirements-ci.txt; else REQ=repo/requirements.txt; fi
          if [ -f "$REQ" ]; then
            sudo python3 -m pip install --break-system-packages --no-cache-dir --quiet --ignore-installed cryptography -r "$REQ" || \
              python3 -m pip install --break-system-packages --no-cache-dir --quiet --ignore-installed cryptography -r "$REQ" || true
          fi
          COVDIR=$(dirname "$(sed -n 's/^sonar.python.coverage.reportPaths=\([^,]*\).*/\1/p' repo/sonar-project.properties | head -1)")
          mkdir -p "repo/$COVDIR"
          MKARGS=$(cat "$MK")
          ( cd repo && PYTHONPATH="$(pwd):$PYTHONPATH" python3 -m pytest $MKARGS \
              --cov-report=xml:"$(pwd)/$COVDIR/coverage.xml" -q -p no:cacheprovider \
              --continue-on-collection-errors -o addopts= ) || true
          ls -la "repo/$COVDIR/" | head -5
      - name: SonarQube (SAST + calidad) — 1er análisis
        # El gate NO corta aquí: se evalúa igual, pero el rojo se emite en el
        # último paso. Así los escáneres y DefectDojo reciben sus informes
        # aunque el gate esté en rojo (antes se perdían todos: run 466 y 500).
        run: |
          set -e
          if [ ! -f repo/sonar-project.properties ]; then
            echo "Sin sonar-project.properties — se omite (no analizado en Sonar)."; exit 0
          fi
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq openjdk-17-jre-headless unzip >/dev/null
          # binaries.sonarsource.com da 403 sin UA; Maven Central es fiable.
          curl -fsSL -o /tmp/sonar.zip https://repo1.maven.org/maven2/org/sonarsource/scanner/cli/sonar-scanner-cli/8.1.0.6389/sonar-scanner-cli-8.1.0.6389.zip
          sudo unzip -q -o /tmp/sonar.zip -d /opt
          cd repo
          # Sin `-Dsonar.login`: el scanner lee SONAR_TOKEN del entorno, así el
          # token no aparece en /proc/<pid>/cmdline (visible por cualquiera del
          # contenedor y por `ps`).
          /opt/sonar-scanner-8.1.0.6389/bin/sonar-scanner \
            -Dsonar.host.url="$SONAR_URL" \
            -Dsonar.qualitygate.wait=true -Dsonar.scm.disabled=true || echo "SONAR_GATE_FAILED=1" >> "$GITHUB_ENV"
      - name: Herramientas
        if: always()
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip git curl >/dev/null
          curl -fsSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          curl -fsSL -o /tmp/tr.tgz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          sudo tar -xzf /tmp/tr.tgz -C /usr/local/bin trivy
          python3 -m pip install --no-cache-dir --quiet bandit semgrep checkov 2>/dev/null || \
            python3 -m pip install --break-system-packages --no-cache-dir --quiet bandit semgrep checkov
          # pip sin sudo instala en ~/.local/bin, que NO está en el PATH de los
          # steps siguientes -> instalar como root en /usr/local/bin siempre.
          sudo python3 -m pip install --break-system-packages --no-cache-dir --quiet bandit semgrep checkov 2>/dev/null || true
          for b in bandit semgrep checkov; do command -v $b >/dev/null || sudo ln -sf "$HOME/.local/bin/$b" /usr/local/bin/$b 2>/dev/null || true; done
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p scans
          gitleaks version; trivy --version | head -1; bandit --version 2>&1 | head -1; semgrep --version
      - name: gitleaks (secretos)
        if: always()
        run: |
          mkdir -p scans
          gitleaks detect --source repo --no-git -f json -r scans/gitleaks.json || true
      - name: trivy (deps/vulns)
        if: always()
        run: cd repo && trivy fs --scanners vuln,secret --format json --output ../scans/trivy.json . || true
      - name: semgrep (SAST)
        if: always()
        run: cd repo && semgrep scan --config auto --json --output ../scans/semgrep.json --metrics=off -q || true
      - name: checkov (IaC)
        if: always()
        run: cd repo && checkov -d . -o json --quiet --soft-fail > ../scans/checkov.json || true
      - name: bandit (Python)
        if: always()
        run: |
          if [ -f repo/requirements.txt ] || [ -f repo/pyproject.toml ]; then
            cd repo && bandit -r . -f json -o ../scans/bandit.json -q || true
          fi
      - name: Subir a DefectDojo
        # DOJO_URL y DOJO_API_TOKEN llegan por GITHUB_ENV (paso "Secretos"):
        # re-declararlos aquí con `${{ env.X }}` los sobrescribiría con vacío,
        # porque ese contexto sólo ve el `env:` del workflow, no GITHUB_ENV.
        if: always()
        env:
          CI_UPLOAD_DIR: scans
        run: |
          [ -f repo/.security/dojo_upload.py ] || { echo "sin dojo_upload.py — se omite"; exit 0; }
          python3 repo/.security/dojo_upload.py

      - name: Veredicto
        # El gate de Sonar se difirió aquí a propósito: es lo único que puede
        # dejar el job en rojo, y sólo después de haber alimentado DefectDojo.
        run: |
          if [ -n "$SONAR_GATE_FAILED" ]; then
            echo "::error::SonarQube quality gate FAILED"
            exit 1
          fi
          echo "gate OK o sin proyecto Sonar"
