sonar.projectKey=overmind_flutter
sonar.projectName=overmind_flutter
sonar.sources=lib,test
sonar.exclusions=build/**,android/**,ios/**,linux/**,assets/**,docs/**,tool/**,graphify-out/**
sonar.coverage.exclusions=lib/main.dart,lib/main_demo.dart,lib/src/screens/**,lib/src/widgets/**,lib/src/theme.dart,lib/src/game/battle_game.dart,lib/src/ble/neurosky_ble.dart
sonar.dart.file.suffixes=.dart
